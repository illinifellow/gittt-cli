name: Bug report
description: Something gittt draws or does wrong
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, where on the screen, and a screenshot if it shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `gittt` in …
        2. Click …
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      placeholder: iTerm2 3.5 on macOS 15
